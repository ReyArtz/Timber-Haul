services:
  - type: web
    name: timber-haul-api
    env: dotnet
    region: frankfurt
    root: backend/TimberHaul.API
    buildCommand: dotnet publish -c Release -o out
    startCommand: dotnet out/TimberHaul.API.dll
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:$PORT
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: timber-haul-db
          property: connectionString
      - key: JWT_KEY
        value: kJ8n3mP9xW2qR5tY7uL1vB4cD6fG0hZ9jK3mN8pQ2sT5wX7yA1bC4eF6g
      - key: JWT_ISSUER
        value: TimberHaul
      - key: JWT_AUDIENCE
        value: TimberHaulApp

databases:
  - name: timber-haul-db
    databaseName: timberhaul
    user: timberhaul_user
    region: frankfurt
    plan: free
